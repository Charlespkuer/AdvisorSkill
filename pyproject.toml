[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "advisorskill"
version = "0.1.0"
description = "Build evidence-backed writing skills from reviewed advisor feedback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
advisorskill = "advisorskill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
